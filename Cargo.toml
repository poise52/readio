[workspace]
members = ["crates/desk-core", "crates/desk-app", "crates/desk-render"]
exclude = ["crates/desk-render/vendor/msedge-tts"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
encoding_rs = "0.8"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
zeroize = "1"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
winapi-util = "0.1.11"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "rt-multi-thread", "macros", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
msedge-tts = { path = "crates/desk-render/vendor/msedge-tts", version = "0.4.1" }


[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
