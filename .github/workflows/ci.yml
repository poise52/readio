name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --test scripts/prepare-release.test.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run generate
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --target ${{ matrix.target }} --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }} --workspace
      - run: cargo test --locked --target ${{ matrix.target }} -p readio-desktop --lib --features tauri/custom-protocol embeds_index_html
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm --prefix frontend run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: readio-windows11-x64-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm --prefix frontend run tauri -- build --ci --target aarch64-apple-darwin --bundles app,dmg -- --locked
      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/aarch64-apple-darwin/release/bundle/macos/Readio.app target/aarch64-apple-darwin/release/bundle/Readio-macos-apple-silicon.zip
          ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg >/dev/null
      - name: Upload macOS application and disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: readio-macos-apple-silicon
          path: |
            target/aarch64-apple-darwin/release/bundle/Readio-macos-apple-silicon.zip
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions-rust-lang/audit@v1
        with:
          createIssues: false
